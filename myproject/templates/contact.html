{%extends 'base.html'%}

{%block title %}CONTACT {%endblock title%}
{%block body%}
<div class="container-fluid mb-4 px-1">
    <img src="https://images.unsplash.com/photo-1596524430615-b46475ddff6e?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" class="d-block w-100" alt="...">
    
</div>
<div class="container mb-3 py-4"><h1 class="text-center">CONTACT US</h1>

<form method="post" action="/contact">
  {%csrf_token%}
  <div class="form-group">
    <label for="name">Name</label>
    <input type="text" class="form-control" id="name" name="name" placeholder=" Enter your Name">
  </div>
  <div class="form-group">
    <label for="email">Email address</label>
    <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email id">
  </div>
  <div class="form-group">
    <label for="phone">Phone number</label>
    <input type="phone" class="form-control" id="phone" name="phone"  placeholder="Enter your phoe number">
  </div>
  <div class="form-group">
    <label for="exampleFormControlTextarea1">Tell your Query or Reason of contact</label>
    <input type="text" class="form-control" id="exampleFormControlTextarea1" name="desc" placeholder="Reason for Contact">
  </div>
  <button class="btn btn-primary" type="submit"> Submit</button>
</form>
</div>
{%endblock body%}
